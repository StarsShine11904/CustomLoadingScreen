name: Build and Package Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出原始碼
        uses: actions/checkout@v4

      - name: 設定 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 賦予 gradlew 執行權限
        run: chmod +x gradlew

      - name: 執行 Gradle 建置與打包
        run: ./gradlew build --stacktrace

      - name: 上傳建置成果 (Mod Jar)
        uses: actions/upload-artifact@v4
        with:
          name: custom-loading-screen-build
          path: build/libs/*.jar
          if-no-files-found: error
